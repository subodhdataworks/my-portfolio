  <text x="120" y="525" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Input Vectors</text>
  <text x="240" y="525" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Hidden Layers</text>
  <text x="380" y="525" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Attention Block</text>
  <text x="510" y="525" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Target Output</text>

