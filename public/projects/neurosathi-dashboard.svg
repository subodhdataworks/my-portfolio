    <line x1="120" y1="340" x2="240" y2="380"/>
    <line x1="120" y1="340" x2="240" y2="450"/>
    <line x1="120" y1="410" x2="240" y2="310"/>
    <line x1="120" y1="410" x2="240" y2="380"/>
    <line x1="120" y1="410" x2="240" y2="450"/>
    <line x1="120" y1="480" x2="240" y2="310"/>
    <line x1="120" y1="480" x2="240" y2="380"/>
    <line x1="120" y1="480" x2="240" y2="450"/>
    
    <line x1="240" y1="310" x2="380" y2="340"/>
    <line x1="240" y1="380" x2="380" y2="340"/>
    <line x1="240" y1="450" x2="380" y2="340"/>
    <line x1="240" y1="310" x2="380" y2="430"/>
    <line x1="240" y1="380" x2="380" y2="430"/>
    <line x1="240" y1="450" x2="380" y2="430"/>

    <line x1="380" y1="340" x2="510" y2="385"/>
    <line x1="380" y1="430" x2="510" y2="385"/>
  </g>

  <!-- Nodes -->
  <circle cx="120" cy="340" r="14" fill="#3B82F6"/>
  <circle cx="120" cy="410" r="14" fill="#3B82F6"/>
  <circle cx="120" cy="480" r="14" fill="#3B82F6"/>

  <circle cx="240" cy="310" r="14" fill="#8B5CF6"/>
  <circle cx="240" cy="380" r="14" fill="#8B5CF6"/>
  <circle cx="240" cy="450" r="14" fill="#8B5CF6"/>

  <circle cx="380" cy="340" r="14" fill="#EC4899"/>
  <circle cx="380" cy="430" r="14" fill="#EC4899"/>

  <circle cx="510" cy="385" r="18" fill="#10B981"/>
