  <text x="60" y="175" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">🏆 2nd Prize</text>
  <text x="210" y="175" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">2026</text>

  <rect x="275" y="110" width="215" height="95" rx="12" fill="#0f1947" stroke="#253a8c" stroke-width="1.5"/>
  <text x="295" y="138" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">Project Role</text>
  <text x="295" y="175" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold">Team Psytech</text>
  <text x="445" y="175" fill="#60A5FA" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Core</text>

  <rect x="510" y="110" width="215" height="95" rx="12" fill="#0f1947" stroke="#253a8c" stroke-width="1.5"/>
  <text x="530" y="138" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">Model Accuracy</text>
