  <text x="665" y="258" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">Key Achievements</text>

  <rect x="665" y="280" width="270" height="85" rx="10" fill="#131e54" stroke="#8B5CF6" stroke-width="1"/>
  <text x="680" y="305" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">AI Innovation Challenge 2026</text>
  <text x="680" y="325" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="11">Secured 2nd Prize among dozens of nationwide teams tackling critical societal problems.</text>
  <text x="680" y="352" fill="#60A5FA" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Team Psytech • Python &amp; PyTorch</text>

  <rect x="665" y="380" width="270" height="95" rx="10" fill="#131e54" stroke="#3B82F6" stroke-width="1"/>
  <text x="680" y="405" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">End-to-End ML Pipeline</text>
  <text x="680" y="425" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="11">• Automated exploratory data analysis (EDA)</text>
  <text x="680" y="445" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="11">• Outlier removal &amp; feature transformation</text>
  <text x="680" y="465" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="11">• Fast real-time inference latency &lt; 80ms</text>

  <rect x="665" y="490" width="270" height="85" rx="10" fill="#131e54" stroke="#10B981" stroke-width="1"/>
  <text x="680" y="515" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Production Integration</text>
  <text x="680" y="535" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="11">Dockerized container deployment with Python API microservice and metric logging.</text>
