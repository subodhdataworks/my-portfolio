  <text x="75" y="66" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16" text-anchor="middle">🧠</text>
  <text x="105" y="66" fill="#ffffff" font-family="Segoe UI, sans-serif" font-weight="700" font-size="20">NeuroSathi - AI Innovation Platform</text>
  <rect x="715" y="45" width="130" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.3" stroke="#8B5CF6"/>
  <text x="780" y="65" fill="#C4B5FD" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">2nd Prize Award</text>
  <rect x="855" y="45" width="90" height="30" rx="15" fill="#3B82F6" fill-opacity="0.3" stroke="#3B82F6"/>
  <text x="900" y="65" fill="#93C5FD" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Python / ML</text>

